#:schema https://developers.openai.com/codex/config-schema.json

model = "gpt-6-luna"
model_reasoning_effort = "high"

[agents]
enabled = true
max_concurrent_threads_per_session = 4
interrupt_message = true
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "high"

[agents.implementer]
description = "Executa features e correções já suficientemente compreendidas, preservando arquitetura, contratos e escopo."
config_file = "agents/implementer.toml"

[agents.planner]
description = "Investiga bugs desconhecidos e tarefas complexas, reduzindo incerteza e produzindo planos executáveis sem editar a implementação."
config_file = "agents/planner.toml"

[agents.reviewer]
description = "Faz revisão independente de alterações, procurando defeitos, regressões e riscos concretos sem reimplementar por preferência."
config_file = "agents/reviewer.toml"

[agents.architect]
description = "Analisa decisões estruturais de alto impacto, contratos, persistência, concorrência e trade-offs arquiteturais sem editar diretamente."
config_file = "agents/architect.toml"
